<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2f5d3a">
<title>Fort Pop!</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    background: linear-gradient(#8fd3ff 0%, #c9ecff 38%, #6fbf5a 38%, #4f9a3e 100%);
    color: #2b1d0e;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px 4px; font-weight: bold; font-size: 20px;
  }
  .pill { background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 14px; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  #title { font-size: 30px; margin: 4px 0 0; color: #fff; text-shadow: 0 3px 0 #2f5d3a, 0 0 8px rgba(0,0,0,.25); letter-spacing: 1px; }
  #fort {
    position: relative; width: 100%; max-width: 520px; flex: 1;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 6px; padding: 10px 14px 24px;
  }
  .spot { position: relative; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  /* The "hole" each character pops out of: a log stump or a dug hole */
  .spot::after {
    content: ""; position: absolute; bottom: 4px; left: 8%; width: 84%; height: 30%;
    border-radius: 50%; z-index: 2; pointer-events: none;
  }
  .spot.log::after  { background: radial-gradient(ellipse at center, #e2b47a 0 35%, #b07a3e 36% 60%, #6b4320 61%); border: 3px solid #4a2d14; }
  .spot.hole::after { background: radial-gradient(ellipse at center, #2b1a0b 0 55%, #5a3b1c 56%); border: 3px solid #7a5530; }
  .critter {
    position: absolute; bottom: -100%; width: 80%; aspect-ratio: 1; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: bottom .18s ease-out; cursor: pointer;
  }
  .critter.up { bottom: 14%; }
  .critter .face { font-size: clamp(42px, 13vw, 64px); line-height: 1; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
  .critter .prop { position: absolute; right: 2%; top: 8%; font-size: clamp(22px, 7vw, 32px); }
  .critter .tag {
    margin-top: 2px; font-size: 13px; font-weight: bold; background: #fff8e6; border-radius: 8px; padding: 1px 6px;
    border: 2px solid #4a2d14;
  }
  .critter.hit .face { animation: spin .35s linear; }
  @keyframes spin { to { transform: rotate(360deg) scale(.8); } }
  .float {
    position: absolute; z-index: 5; font-weight: bold; font-size: 22px; pointer-events: none;
    animation: rise .8s ease-out forwards; text-shadow: 0 2px 0 #fff;
  }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-60px); opacity: 0; } }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10;
    background: rgba(31, 52, 30, .72); padding: 20px;
  }
  .card {
    background: #fff8e6; border: 4px solid #4a2d14; border-radius: 20px; padding: 22px; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 0 8px 0 #4a2d14;
  }
  .card h2 { margin: 0 0 8px; font-size: 30px; }
  .card p { margin: 6px 0; font-size: 16px; }
  .legend { text-align: left; margin: 12px auto; font-size: 16px; line-height: 1.7; display: inline-block; }
  button.big {
    margin-top: 14px; font: inherit; font-size: 24px; font-weight: bold; color: #fff; background: #e8562a;
    border: none; border-radius: 14px; padding: 12px 34px; box-shadow: 0 5px 0 #a3361a; cursor: pointer;
  }
  button.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #a3361a; }
  .hidden { display: none; }
  .verse { font-style: italic; color: #2f5d3a; margin-top: 10px; }
</style>
</head>
<body>

<div id="title">🪵 Fort Pop! 🪵</div>
<header>
  <span class="pill">⭐ <span id="score">0</span></span>
  <span class="pill">⏱️ <span id="time">30</span></span>
  <span class="pill">🏆 <span id="best">0</span></span>
</header>

<main id="fort"></main>

<!-- Start screen -->
<div class="overlay" id="startScreen">
  <div class="card">
    <h2>Fort Pop!</h2>
    <p>The family is hiding in the backyard fort. Tap them fast!</p>
    <div class="legend">
      👦🥣 <b>Levi</b> + yogurt = 10<br>
      👧🧸 <b>Chloe</b> + teddy = 10<br>
      👩✨ <b>Mom</b> is fancy = 20<br>
      👨⛳ <b>Dad</b> yells FORE! = 10<br>
      🦝 Raccoon = −15 &nbsp; 🦟 Mosquito = −5
    </div>
    <br>
    <button class="big" id="startBtn">Play!</button>
  </div>
</div>

<!-- Game over screen -->
<div class="overlay hidden" id="endScreen">
  <div class="card">
    <h2 id="endTitle">Time's up!</h2>
    <p style="font-size:22px">You scored <b id="finalScore">0</b></p>
    <p id="bestMsg"></p>
    <p class="verse">Built on a firm foundation! 🏡</p>
    <button class="big" id="againBtn">Play again</button>
  </div>
</div>

<script>
// ---------- Characters ----------
// Each one: face emoji, prop emoji, name tag, points, and a little message when tapped.
const CHARACTERS = [
  { face: "👦", prop: "🥣", tag: "Levi",  points: 10, say: "Yogurt!",   weight: 3 },
  { face: "👧", prop: "🧸", tag: "Chloe", points: 10, say: "Teddy!",    weight: 3 },
  { face: "👩", prop: "✨", tag: "Mom",   points: 20, say: "Fancy!",    weight: 2 },
  { face: "👨", prop: "⛳", tag: "Dad",   points: 10, say: "FORE! 🏌️", weight: 3 },
  { face: "🦝", prop: "",   tag: "",      points: -15, say: "Raccoon!", weight: 2 },
  { face: "🦟", prop: "",   tag: "",      points: -5,  say: "Bzzz!",    weight: 2 },
];
const ROUND_SECONDS = 30;

// ---------- Build the fort: 9 spots, mix of log stumps and dug holes ----------
const fort = document.getElementById("fort");
const spots = [];
for (let i = 0; i < 9; i++) {
  const spot = document.createElement("div");
  spot.className = "spot " + (i % 2 === 0 ? "log" : "hole");
  const critter = document.createElement("div");
  critter.className = "critter";
  critter.innerHTML = '<span class="face"></span><span class="prop"></span><span class="tag"></span>';
  spot.appendChild(critter);
  fort.appendChild(spot);
  const s = { spot, critter, char: null, timer: null };
  critter.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(s); });
  spots.push(s);
}

// ---------- Game state ----------
let score = 0, timeLeft = ROUND_SECONDS, playing = false, popTimer = null, clockTimer = null;
const $ = (id) => document.getElementById(id);

function loadBest() { try { return Number(localStorage.getItem("fortPopBest")) || 0; } catch { return 0; } }
function saveBest(n) { try { localStorage.setItem("fortPopBest", String(n)); } catch {} }
$("best").textContent = loadBest();

// ---------- Tiny sound effects (no files needed) ----------
let audio;
function beep(freq, ms, type = "square") {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + ms / 1000);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + ms / 1000);
  } catch {}
}

// ---------- Pick a random character (weighted) ----------
function pickCharacter() {
  const total = CHARACTERS.reduce((sum, c) => sum + c.weight, 0);
  let r = Math.random() * total;
  for (const c of CHARACTERS) { if ((r -= c.weight) < 0) return c; }
  return CHARACTERS[0];
}

// ---------- Pop someone up ----------
function popUp() {
  if (!playing) return;
  const empty = spots.filter((s) => !s.char);
  if (empty.length) {
    const s = empty[Math.floor(Math.random() * empty.length)];
    const c = pickCharacter();
    s.char = c;
    s.critter.querySelector(".face").textContent = c.face;
    s.critter.querySelector(".prop").textContent = c.prop;
    const tag = s.critter.querySelector(".tag");
    tag.textContent = c.tag; tag.style.display = c.tag ? "" : "none";
    s.critter.classList.remove("hit");
    s.critter.classList.add("up");
    // Stay up for less time as the round goes on
    const stay = 700 + timeLeft * 30;
    s.timer = setTimeout(() => hide(s), stay);
  }
  // Pop faster as time runs down
  const gap = 350 + timeLeft * 18;
  popTimer = setTimeout(popUp, gap);
}

function hide(s) {
  clearTimeout(s.timer);
  s.critter.classList.remove("up");
  setTimeout(() => { s.char = null; }, 180);
}

// ---------- Tap! ----------
function tap(s) {
  if (!playing || !s.char || !s.critter.classList.contains("up") || s.critter.classList.contains("hit")) return;
  const c = s.char;
  score += c.points;
  $("score").textContent = score;
  s.critter.classList.add("hit");
  showFloat(s.spot, (c.points > 0 ? "+" : "") + c.points + " " + c.say, c.points > 0 ? "#2f5d3a" : "#c0392b");
  if (c.points > 0) beep(c.points >= 20 ? 880 : 660, 120); else beep(140, 200, "sawtooth");
  if (navigator.vibrate && c.points < 0) navigator.vibrate(80);
  setTimeout(() => hide(s), 200);
}

function showFloat(spot, text, color) {
  const f = document.createElement("div");
  f.className = "float"; f.textContent = text; f.style.color = color;
  f.style.left = spot.offsetLeft + spot.offsetWidth / 2 - 50 + "px";
  f.style.top = spot.offsetTop + 10 + "px";
  f.style.width = "100px"; f.style.textAlign = "center";
  fort.appendChild(f);
  setTimeout(() => f.remove(), 800);
}

// ---------- Start / end ----------
function start() {
  score = 0; timeLeft = ROUND_SECONDS; playing = true;
  $("score").textContent = 0; $("time").textContent = timeLeft;
  $("startScreen").classList.add("hidden"); $("endScreen").classList.add("hidden");
  spots.forEach(hide);
  beep(520, 100); setTimeout(() => beep(780, 140), 120);
  popUp();
  clockTimer = setInterval(() => {
    timeLeft--; $("time").textContent = timeLeft;
    if (timeLeft <= 0) end();
  }, 1000);
}

function end() {
  playing = false;
  clearInterval(clockTimer); clearTimeout(popTimer);
  spots.forEach(hide);
  const best = loadBest();
  $("finalScore").textContent = score;
  if (score > best) {
    saveBest(score); $("best").textContent = score;
    $("endTitle").textContent = "New high score! 🏆";
    $("bestMsg").textContent = "Beat the old best of " + best + "!";
  } else {
    $("endTitle").textContent = "Time's up!";
    $("bestMsg").textContent = "Best so far: " + best;
  }
  setTimeout(() => $("endScreen").classList.remove("hidden"), 400);
}

$("startBtn").addEventListener("click", start);
$("againBtn").addEventListener("click", start);
</script>
</body>
</html>
